<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keys_Osi Figma fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; color: rgb(17, 24, 39); background: rgb(255, 255, 255); }
  #main-nav { display: flex; flex-direction: row; gap: 24px; padding: 16px 32px; align-items: center; background: rgb(15, 23, 42); }
  #main-nav a { color: rgb(255, 255, 255); text-decoration: none; font-size: 16px; line-height: 24px; }
  .icon { width: 24px; height: 24px; color: rgb(220, 38, 38); }
  .hero {
    position: relative; height: 240px; padding: 48px;
    background-image: radial-gradient(circle at 25% 50%, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 100%), linear-gradient(90deg, rgb(255, 0, 0) 0%, rgb(0, 0, 255) 100%);
    border-radius: 24px 8px 0px 16px;
    box-shadow: 0px 4px 12px 2px rgba(0, 0, 0, 0.25), inset 0px 1px 0px 0px rgba(255, 255, 255, 0.5);
  }
  .hero::before {
    content: "Nouveau"; position: absolute; top: 12px; left: 12px; width: 80px; height: 24px;
    background: rgb(250, 204, 21); border-radius: 12px; font-size: 12px; line-height: 24px; text-align: center; color: rgb(0, 0, 0);
  }
  .hero h1 { margin: 0; font-size: 40px; line-height: 48px; color: rgb(255, 255, 255); }
  .cards { display: grid; grid-template-columns: repeat(3, 200px); column-gap: 20px; row-gap: 20px; padding: 24px; }
  .card {
    display: flex; flex-direction: column; gap: 8px; padding: 16px;
    border: 1px solid rgb(229, 231, 235); border-bottom: 4px solid rgb(37, 99, 235); border-radius: 12px;
    background: rgb(249, 250, 251); box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.1);
  }
  .card h3 { margin: 0; font-size: 18px; line-height: 24px; }
  .card p { margin: 0; font-size: 14px; line-height: 20px; }
  .photo { display: block; width: 300px; height: 150px; object-fit: cover; }
  p.lead { margin: 24px; width: 500px; font-family: "Keys Missing Font", Arial, sans-serif; font-size: 16px; line-height: 24px; }
  p.lead b { font-weight: 700; }
  .ghost { position: absolute; top: 0; right: 0; width: 10px; height: 10px; background: rgb(255, 0, 0); visibility: hidden; }
  p.lead a { color: rgb(37, 99, 235); text-decoration: underline; }
</style>
</head>
<body>
  <nav id="main-nav" aria-label="Navigation principale">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l3 7h7l-6 4 2 7-6-4-6 4 2-7-6-4h7z"/></svg>
    <a href="/accueil">Accueil</a>
    <a href="/produits">Produits</a>
    <a href="/contact">Contact</a>
  </nav>
  <section class="hero"><h1>Titre héros</h1></section>
  <div class="cards">
    <article class="card"><h3>Carte 1</h3><p>Texte un</p></article>
    <article class="card"><h3>Carte 2</h3><p>Texte deux</p></article>
    <article class="card"><h3>Carte 3</h3><p>Texte trois</p></article>
  </div>
  <img class="photo" src="/photo.png" alt="Photo test">
  <p class="lead">Un paragraphe avec <b>gras</b> et un <a href="https://example.com/doc">lien</a>.</p>
  <div class="ghost"></div>
</body>
</html>
